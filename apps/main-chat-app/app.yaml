command: ["python", "app.py"]

env:
  - name: GENIE_SPACE_ID
    value: "01f12a63ec1011e0acbb09158eda7634"
  - name: LAKEBASE_INSTANCE_NAME
    value: "kaapi-bricks"
  - name: LAKEBASE_DATABASE_NAME
    value: "databricks_postgres"
  # Unity AI Gateway services (Unity Catalog, EXECUTE granted to the app service principal).
  # Every AI call except Genie goes through these; there is no direct serving-endpoint path.
  - name: GW_LLM_MODEL
    value: "fevm_cme_conde_catalog.kaapi_bricks.kaapi_llm"
  - name: GW_EMBED_MODEL
    value: "fevm_cme_conde_catalog.kaapi_bricks.kaapi_embed"
  - name: GW_MCP_SERVICE
    value: "fevm_cme_conde_catalog.kaapi_bricks.kaapi_ops_advisor"

resources:
  - name: genie-space
    genie_space:
      space_id: "01f12a63ec1011e0acbb09158eda7634"
      permission: CAN_EDIT
  - name: lakebase
    database:
      instance_name: "kaapi-bricks"
      database_name: "databricks_postgres"
      permission: CAN_CONNECT_AND_CREATE
  - name: sql-warehouse
    sql_warehouse:
      id: "e755eae9d758fdf7"
      permission: CAN_USE
