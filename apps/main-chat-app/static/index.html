<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaapi Bricks — Premium South Indian Filter Coffee</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FDFBF7;color:#2D1810;height:100vh;overflow:hidden}

/* ===== LANDING PAGE ===== */
.landing{height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 48px;border-bottom:1px solid #E8DDD0;background:#FDFBF7;position:sticky;top:0;z-index:50}
.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-brand span:first-child{font-size:1.5rem}
.nav-brand span:last-child{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:#3C1810}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{text-decoration:none;color:#6B4C3B;font-size:0.85rem;font-weight:500;transition:color 0.2s}
.nav-links a:hover{color:#3C1810}
.nav-chat{background:#3C1810;color:white!important;padding:7px 18px;border-radius:8px;font-size:0.82rem!important;transition:background 0.2s!important}
.nav-chat:hover{background:#5C2E1A;color:white!important}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px 28px;background:linear-gradient(180deg,#FDFBF7 0%,#F5EDE0 100%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:#E8DDD0;color:#6B4C3B;padding:6px 16px;border-radius:20px;font-size:0.75rem;font-weight:600;margin-bottom:20px;letter-spacing:1px;text-transform:uppercase}
.hero h1{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;color:#2D1810;line-height:1.15;max-width:600px;margin-bottom:10px}
.hero p{font-size:0.98rem;color:#6B4C3B;max-width:480px;line-height:1.6;margin-bottom:28px}
.search-wrap{width:100%;max-width:600px;position:relative}
.search-input{width:100%;padding:16px 52px 16px 22px;font-size:0.95rem;border:2px solid #D4C4B0;border-radius:14px;background:white;color:#2D1810;outline:none;font-family:'Inter',sans-serif;box-shadow:0 4px 20px rgba(60,24,16,0.06);transition:all 0.3s}
.search-input:focus{border-color:#8B5E3C;box-shadow:0 4px 28px rgba(60,24,16,0.12)}
.search-input::placeholder{color:#A89585}
.search-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:#3C1810;border:none;border-radius:9px;color:white;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
.search-btn:hover{background:#5C2E1A}

/* Quick questions below search */
.qp-below{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px;max-width:600px}

/* Products section */
.products-section{padding:32px 48px 40px;max-width:1200px;margin:0 auto;width:100%}
.products-header{text-align:center;margin-bottom:24px}
.products-header h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#2D1810;margin-bottom:4px}
.products-header p{font-size:0.85rem;color:#8B7355}
.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.prod-card{background:white;border:1px solid #E8DDD0;border-radius:14px;padding:20px 16px;text-align:center;transition:all 0.25s;cursor:default;position:relative;overflow:hidden}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(60,24,16,0.08);border-color:#D4C4B0}
.prod-emoji{font-size:2.4rem;margin-bottom:10px;display:block}
.prod-name{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:600;color:#2D1810;margin-bottom:4px}
.prod-desc{font-size:0.78rem;color:#8B7355;line-height:1.4}
.prod-tag{display:inline-block;background:#F5EDE0;color:#8B5E3C;padding:3px 10px;border-radius:10px;font-size:0.68rem;font-weight:600;margin-top:8px;text-transform:uppercase;letter-spacing:0.5px}

/* Highlights bar */
.highlights{display:flex;justify-content:center;gap:40px;padding:20px 48px;background:#3C1810;color:white}
.hl{display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:500}
.hl-icon{font-size:1.1rem}

/* Footer */
.landing-footer{padding:16px 48px;text-align:center;font-size:0.75rem;color:#A89585;border-top:1px solid #E8DDD0;background:#FDFBF7}
.landing-footer a{color:#8B5E3C;text-decoration:none;font-weight:500}

/* ===== CHAT PAGE ===== */
.chat-page{display:flex;height:100vh}

/* Left panel */
.left{width:280px;min-width:280px;background:#F8F3EC;border-right:1px solid #E8DDD0;display:flex;flex-direction:column;padding:16px}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:none;background:none;color:#6B4C3B;font-size:0.85rem;cursor:pointer;margin-bottom:12px;border-radius:8px}
.back-btn:hover{background:#E8DDD0}

/* Lakebase card */
.lb-card{background:#1E293B;border-radius:12px;padding:14px;margin-bottom:14px;color:white}
.lb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lb-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:0.82rem;letter-spacing:.5px}
.lb-dot{width:8px;height:8px;background:#4ADE80;border-radius:50%}
.lb-dot.off{background:#EF4444}
.lb-status{font-size:0.72rem;color:#4ADE80;font-weight:500}
.lb-status.off{color:#EF4444}
.lb-row{margin-bottom:6px}
.lb-label{font-size:0.62rem;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px}
.lb-value{font-size:0.85rem;color:#F1F5F9;font-weight:500}
.stats-row{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;text-align:center;background:white;border:1px solid #E8DDD0;border-radius:10px;padding:10px 4px}
.stat-num{font-size:1.5rem;font-weight:700;color:#2D1810}
.stat-lbl{font-size:0.68rem;color:#A89585}

.mem-card{background:white;border:1px solid #E8DDD0;border-radius:10px;padding:12px;margin-bottom:14px}
.mem-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mem-toggle span{font-weight:600;font-size:0.85rem;color:#2D1810}
.mem-toggle button{background:none;border:none;font-size:1rem;cursor:pointer;color:#6B4C3B}
.mem-row{margin-bottom:6px}
.mem-key{font-size:0.78rem;color:#8B5E3C;font-weight:600}
.mem-val{font-size:0.78rem;color:#6B4C3B}

.section-lbl{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#A89585;margin:12px 0 8px}
.store-sel{width:100%;padding:8px 10px;border:1px solid #D4C4B0;border-radius:8px;background:white;font-size:0.8rem;color:#3C1810;margin-bottom:8px}

/* Cached questions — minimal at bottom */
.cq{padding:4px 6px;margin-bottom:2px;background:transparent;border:none;border-bottom:1px solid #EDE6DC;border-radius:0;font-size:0.65rem;color:#A89585;cursor:pointer;transition:all 0.15s;line-height:1.25}
.cq:hover{color:#3C1810;background:#F5EDE0}

.new-btn{margin-top:auto;padding:10px;background:#3C1810;color:white;border:none;border-radius:10px;font-size:0.85rem;font-weight:500;cursor:pointer;width:100%}
.new-btn:hover{background:#5C2E1A}
.cq-section{padding-top:6px;border-top:1px solid #E8DDD0;margin-top:8px}

/* Chat center */
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.ch-header{padding:12px 24px;border-bottom:1px solid #E8DDD0;display:flex;align-items:center;justify-content:space-between;background:white}
.ch-header-left{display:flex;align-items:center}
.ch-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:#2D1810}
.ch-sub{font-size:0.78rem;color:#A89585;margin-left:10px}
.ch-powered{font-size:0.75rem;color:#3C1810;display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:0.3px}
.ch-powered-dot{width:6px;height:6px;background:#E8653A;border-radius:50%}
.ch-msgs{flex:1;overflow-y:auto;padding:20px 24px}
.ch-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.ch-empty h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#2D1810;margin-bottom:8px}
.ch-empty p{color:#A89585;font-size:0.92rem;max-width:380px;line-height:1.6}

.mu{text-align:left;padding:8px 0}
.mu-b{display:inline-block;background:#F0EAE0;border-radius:14px 14px 14px 4px;padding:10px 14px;max-width:85%;font-size:0.9rem;color:#2D1810}
.ma{padding:8px 0}
.ma-c{background:white;border:1px solid #E8DDD0;border-left:3px solid #D4C4B0;border-radius:14px;padding:18px;max-width:92%}
.ma-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #F0E8DC}
.ma-av{width:28px;height:28px;background:#3C1810;border-radius:7px;display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem}
.ma-n{font-weight:600;color:#2D1810;font-size:0.85rem}
.ma-body{font-size:0.9rem;line-height:1.7;color:#3C1810}
.ma-body h2{font-family:'Playfair Display',serif;font-size:1.1rem;color:#2D1810;margin:12px 0 6px}
.ma-body h3{font-family:'Playfair Display',serif;font-size:1rem;color:#2D1810;margin:10px 0 4px}
.ma-body ul,.ma-body ol{padding-left:18px;margin:6px 0}
.ma-body li{margin-bottom:3px}
.ma-body strong{color:#2D1810}
.ma-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:0.84rem}
.ma-body th{background:#F5EDE0;padding:6px 10px;text-align:left;font-weight:600;border-bottom:2px solid #D4C4B0}
.ma-body td{padding:5px 10px;border-bottom:1px solid #F0E8DC}
.fb-r{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid #F0E8DC}
.fb{padding:2px 8px;border:1px solid #D4C4B0;border-radius:6px;background:white;cursor:pointer;font-size:0.72rem;transition:all 0.15s}
.fb:hover{background:#F5EDE0}
.fb.p{background:#E8F5E9;border-color:#66BB6A}
.fb.n{background:#FFEBEE;border-color:#EF5350}

/* Brewing animation */
.brew-wait{display:flex;flex-direction:column;align-items:center;padding:32px 20px;background:white;border:1px solid #E8DDD0;border-radius:14px;margin:8px 0;animation:fadeIn 0.4s}
.brew-art{font-size:3.5rem;margin-bottom:12px;animation:brew 2s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(139,94,60,0.3))}
@keyframes brew{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.05) rotate(-3deg)}50%{transform:scale(1) rotate(0deg)}75%{transform:scale(1.05) rotate(3deg)}100%{transform:scale(1) rotate(0deg)}}
.brew-steam{display:flex;gap:6px;margin-bottom:10px}
.steam{width:3px;height:18px;background:linear-gradient(to top,#D4C4B0,transparent);border-radius:3px;animation:rise 1.5s ease-in-out infinite}
.steam:nth-child(2){height:24px;animation-delay:0.3s}
.steam:nth-child(3){height:14px;animation-delay:0.6s}
@keyframes rise{0%{opacity:0;transform:translateY(0)}50%{opacity:0.7}100%{opacity:0;transform:translateY(-16px)}}
.brew-msg{font-size:0.88rem;color:#8B7355;font-weight:500}
.brew-sub{font-size:0.75rem;color:#A89585;margin-top:4px}

/* Quick prompts row */
.qp-row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 24px 4px;background:white}
.qp{padding:6px 14px;border:1px solid #D4C4B0;border-radius:18px;background:white;color:#6B4C3B;font-size:0.78rem;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.qp:hover{background:#3C1810;color:white;border-color:#3C1810}
.streaming::after{content:'|';animation:bl .8s infinite;color:#8B5E3C}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}

.ch-bar{padding:12px 24px;border-top:1px solid #E8DDD0;background:white}
.ch-wrap{display:flex;gap:8px}
.ch-in{flex:1;padding:14px 18px;border:1.5px solid #D4C4B0;border-radius:12px;font-size:0.95rem;background:#FDFBF7;color:#2D1810;outline:none;font-family:'Inter',sans-serif}
.ch-in:focus{border-color:#8B5E3C;box-shadow:0 0 0 3px rgba(139,94,60,0.1)}
.ch-in::placeholder{color:#B5A595}
.ch-send{padding:14px 20px;background:#3C1810;color:white;border:none;border-radius:12px;font-size:0.95rem;font-weight:500;cursor:pointer}
.ch-send:hover{background:#5C2E1A}
.ch-send:disabled{background:#C4B5A5;cursor:not-allowed}

.powered{text-align:center;margin-top:12px;font-size:0.72rem;color:#A89585}
.powered a{color:#8B5E3C;text-decoration:none;font-weight:500}

/* Cache hit badge */
.cache-badge{display:inline-flex;align-items:center;gap:4px;background:#E0F2FE;color:#0369A1;padding:3px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;margin-left:8px;letter-spacing:0.3px}
.cache-badge .cb-dot{width:6px;height:6px;background:#0EA5E9;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* ===== ARCHITECTURE TAB ===== */
.arch-page{max-width:1320px;width:100%;margin:0 auto;padding:22px 32px 40px}
.arch-hdr{border-left:4px solid #d9512c;padding-left:16px;margin-bottom:14px}
.arch-hdr h1{font-family:'Playfair Display',serif;font-size:2.2rem;color:#1d140e;line-height:1.1}
.arch-hdr p{color:#5b4a3f;font-size:0.95rem;margin-top:6px;max-width:820px}
.arch-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:0.78rem;color:#3b2e25;align-items:center;margin:10px 0 14px}
.arch-legend span{display:inline-flex;align-items:center;gap:6px}
.arch-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.arch-legend .arch-hint{margin-left:auto;color:#2b59c3;font-weight:600}
.arch-ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.arch-ctrl-lbl{font-size:0.72rem;font-weight:800;letter-spacing:.1em;color:#8a7a6c}
.arch-ctrl-note{margin-left:auto;font-size:0.78rem;color:#8a7a6c}
.arch-tabs{display:flex;gap:6px;flex-wrap:wrap}
.arch-tabs button{border:1.5px solid #D4C4B0;background:#fff;color:#3C1810;border-radius:999px;padding:5px 13px;font:600 0.78rem 'Inter',sans-serif;cursor:pointer;transition:all .25s}
.arch-tabs button.on{background:#3C1810;border-color:#3C1810;color:#fff}
.arch-badge{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;color:#fff;font:800 0.72rem/22px 'Inter',sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:6;cursor:default;transition:transform .2s,opacity .35s}
.arch-badge.hot{transform:scale(1.35)}
.arch-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.arch-stp{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid;border-radius:12px;padding:9px 12px;transition:all .25s;cursor:default}
.arch-stp.hot{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,24,16,.12)}
.arch-stp-n{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font:800 0.75rem/24px 'Inter',sans-serif;text-align:center}
.arch-stp b{display:block;font-size:0.84rem;color:#1d140e}
.arch-stp span{display:block;font-size:0.76rem;color:#5b4a3f;margin-top:2px;line-height:1.4}
.arch-wrap{position:relative;width:100%;overflow:hidden}
.arch-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.arch-svg{position:absolute;left:0;top:0;overflow:visible}
.arch-elabel{font:11px 'Inter',sans-serif}
.arch-flow{animation:arch-dash 1.6s linear infinite}
.arch-flow.still{animation:none}
@keyframes arch-dash{to{stroke-dashoffset:-30}}
.arch-node{position:absolute;border:1.6px solid;border-radius:14px;padding:9px 12px 9px 16px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.arch-node:hover{transform:translateY(-2px)}
.arch-bar{position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0}
.arch-kicker{font-size:0.66rem;font-weight:800;letter-spacing:.12em}
.arch-head{display:flex;align-items:center;gap:8px}
.arch-ic{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:0.8rem;flex:none}
.arch-title{font-weight:700;font-size:0.95rem;color:#1d140e;white-space:nowrap}
.arch-tag{margin-left:auto;font-size:0.62rem;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.arch-sub{font-size:0.74rem;color:#6b5a4e;margin-top:2px;line-height:1.35}
.arch-chips{display:grid;gap:6px;margin-top:7px}
.arch-chip{border:1.3px solid;border-radius:9px;padding:4px 7px;min-width:0;background:#fff;color:#2D1810}
.arch-chip b{display:block;font-size:0.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch-chip span{display:block;font-size:0.62rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch-items{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.arch-item{border-left:3px solid;border-radius:6px;padding:7px 10px;background:#fff;box-shadow:0 1px 0 #ece6dc}
.arch-item b{display:block;font-size:0.8rem;color:#1d140e}
.arch-item span{display:block;font-size:0.7rem;color:#6b5a4e}
.arch-open{position:absolute;right:10px;bottom:6px;font-size:0.62rem;font-weight:700;opacity:0;transition:opacity .2s}
.arch-node:hover .arch-open{opacity:1}
.arch-dot{position:absolute;left:0;top:0;width:11px;height:11px;border-radius:50%;offset-rotate:0deg;animation:arch-move 1.5s linear infinite;z-index:5;pointer-events:none}
@keyframes arch-move{from{offset-distance:0%}to{offset-distance:100%}}
.arch-rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.arch-rules span{background:#fff;border:1px solid #E8DDD0;border-radius:12px;padding:10px 14px;font-size:0.8rem;color:#5b4a3f}
.arch-rules b{color:#1d140e}

@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useRef,useEffect}=React;
const THINK_MSGS=["Searching knowledge base...","Consulting operations documents...","Analyzing sales data...","Reviewing recipes...","Composing answer..."];

function BrewingWait(){
  const[i,set]=useState(0);
  useEffect(()=>{const t=setInterval(()=>set(p=>(p+1)%THINK_MSGS.length),4000);return()=>clearInterval(t)},[]);
  return(
    <div className="brew-wait">
      <div className="brew-steam"><div className="steam"/><div className="steam"/><div className="steam"/></div>
      <div className="brew-art">&#9749;</div>
      <div className="brew-msg">{THINK_MSGS[i]}</div>
      <div className="brew-sub">Brewing your answer...</div>
    </div>
  );
}

// ===== STORE LIVE DASHBOARD (reads Lakebase only) =====
const DASH_REFRESH_MS=10000;
const INK={primary:'#0b0b0b',secondary:'#52514e',muted:'#8a8984',grid:'#e8e6e1',surface:'#ffffff'};
const STATUS={good:'#0ca30c',warning:'#fab219',serious:'#ec835a',critical:'#d03b3b'};
const SEQ='#2a78d6';
const inr=v=>'₹'+Math.round(Number(v)||0).toLocaleString('en-IN');
const fmtDate=d=>{if(!d)return'—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});};
const coverStatus=s=>s.below_reorder?{c:STATUS.critical,icon:'⛔',label:'Reorder now'}
  :(s.days_cover!=null&&s.days_cover<21)?{c:STATUS.warning,icon:'⚠',label:'Watch'}
  :{c:STATUS.good,icon:'✓',label:'OK'};

function DashTile({label,value,sub,status}){
  return(
    <div style={{background:INK.surface,border:'1px solid #E8DFD3',borderRadius:12,padding:'14px 16px',minWidth:0}}>
      <div style={{fontSize:'0.72rem',fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',color:INK.secondary}}>{label}</div>
      <div style={{fontSize:'1.9rem',fontWeight:800,color:INK.primary,lineHeight:1.15,marginTop:4}}>{value}</div>

function StockCoverBars({stock}){
  if(!stock.length)return <div style={{color:INK.muted,fontSize:'0.85rem'}}>No stock rows for this store.</div>;
  const max=Math.max(60,...stock.map(s=>s.days_cover||0));
  return(
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      {stock.map(s=>{const st=coverStatus(s);const w=Math.max(2,(s.days_cover||0)/max*100);
        return(
          <div key={s.ingredient_id} title={`${s.ingredient_name}: ${s.current_stock} ${s.unit} · ${s.days_cover} days of cover · reorder at ${s.reorder_threshold} ${s.unit} · avg use ${s.avg_daily_usage} ${s.unit}/day`}
            style={{display:'grid',gridTemplateColumns:'minmax(120px,190px) 1fr 150px',alignItems:'center',gap:10,fontSize:'0.8rem'}}>
            <div style={{color:INK.primary,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.ingredient_name}</div>
            <div style={{height:14,background:'#f3f1ec',borderRadius:4,position:'relative'}}>
              <div style={{width:w+'%',height:'100%',background:st.c,borderRadius:'0 4px 4px 0'}}/>
            </div>
            <div style={{color:INK.secondary,whiteSpace:'nowrap'}}>
              <span style={{color:INK.primary,fontWeight:700}}>{s.days_cover!=null?s.days_cover.toFixed(1):'—'} d</span> · {Number(s.current_stock).toFixed(1)} {s.unit} <span title={st.label}>{st.icon}</span>
            </div>
          </div>);})}
      <div style={{display:'flex',gap:14,fontSize:'0.72rem',color:INK.secondary,marginTop:4}}>
        {[['critical','⛔','Below reorder threshold'],['warning','⚠','Under 21 days of cover'],['good','✓','21+ days']].map(([k,i,l])=>
          <span key={k} style={{display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,borderRadius:2,background:STATUS[k]}}/>{i} {l}</span>)}

    </div>

}

function DemandColumns({days}){
  const[hover,setHover]=useState(null);
  if(!days.length)return <div style={{color:INK.muted,fontSize:'0.85rem'}}>No recent demand rows for this store.</div>;
  const W=520,H=170,pad={l:36,r:8,t:18,b:26},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const max=Math.max(...days.map(d=>d.units));const top=Math.ceil(max/50)*50||50;
  const band=iw/days.length,bw=Math.min(24,band*0.55);
  const maxIdx=days.findIndex(d=>d.units===max);
  const y=v=>pad.t+ih-(v/top)*ih;
  const r=4;
  return(
    <div style={{position:'relative'}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',maxWidth:W,height:'auto',display:'block'}} role="img" aria-label="Units sold per day">
        {[0,top/2,top].map(t=><g key={t}>
          <line x1={pad.l} x2={W-pad.r} y1={y(t)} y2={y(t)} stroke={INK.grid} strokeWidth="1"/>
          <text x={pad.l-6} y={y(t)+3} textAnchor="end" fontSize="10" fill={INK.secondary}>{t.toLocaleString('en-IN')}</text></g>)}
        {days.map((d,i)=>{const x=pad.l+i*band+(band-bw)/2,h=ih-(y(d.units)-pad.t),yy=y(d.units);
          const path=`M${x},${pad.t+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${pad.t+ih} Z`;
          const label=i===maxIdx||i===days.length-1;
          return(<g key={d.order_date} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
            <rect x={pad.l+i*band} y={pad.t} width={band} height={ih} fill="transparent"/>
            <path d={h>r?path:`M${x},${pad.t+ih} h${bw} v-${Math.max(h,1)} h-${bw} Z`} fill={SEQ} opacity={hover===null||hover===i?1:0.45}/>
            {label&&<text x={x+bw/2} y={yy-5} textAnchor="middle" fontSize="10" fontWeight="700" fill={INK.primary}>{d.units}</text>}
            <text x={x+bw/2} y={H-8} textAnchor="middle" fontSize="10" fill={INK.secondary}>{fmtDate(d.order_date)}</text>
          </g>);})}
      </svg>
      {hover!==null&&<div style={{position:'absolute',top:0,right:0,background:'#1f1f1e',color:'#fff',borderRadius:8,padding:'6px 10px',fontSize:'0.75rem',pointerEvents:'none'}}>
        <b>{fmtDate(days[hover].order_date)}</b> · {days[hover].units} units · {inr(days[hover].revenue)}</div>}
    </div>
  );
}

function DashTable({cols,rows,empty}){
  if(!rows.length)return <div style={{color:INK.muted,fontSize:'0.85rem'}}>{empty}</div>;
  return(
    <div style={{overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}>
        <thead><tr>{cols.map(c=><th key={c.k} style={{textAlign:c.num?'right':'left',padding:'6px 8px',borderBottom:`1px solid ${INK.grid}`,color:INK.secondary,fontWeight:700,whiteSpace:'nowrap'}}>{c.h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>{cols.map(c=><td key={c.k} style={{textAlign:c.num?'right':'left',padding:'6px 8px',borderBottom:`1px solid #f3f1ec`,color:INK.primary,whiteSpace:'nowrap'}}>{c.f?c.f(r):r[c.k]}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function DashCard({title,sub,children}){
  return(
    <div style={{background:INK.surface,border:'1px solid #E8DFD3',borderRadius:12,padding:'14px 16px',minWidth:0}}>
      <div style={{fontSize:'0.9rem',fontWeight:800,color:'#3C1810'}}>{title}</div>
      {sub&&<div style={{fontSize:'0.74rem',color:INK.secondary,margin:'2px 0 10px'}}>{sub}</div>}
      {children}
    </div>
  );
}

function StoreDashboard({store,setStore,stores,onBack,onInvoice}){
  const[data,setData]=useState(null);
  const[err,setErr]=useState(null);
  const[lastOk,setLastOk]=useState(null);
  const[,setTick]=useState(0);
  useEffect(()=>{
    let alive=true;
    const load=async()=>{
      try{
        const r=await fetch('/api/lakebase/dashboard?store='+encodeURIComponent(store));
        const d=await r.json();
        if(!alive)return;
        if(!r.ok||d.error){setErr(d.error||('HTTP '+r.status));}else{setData(d);setErr(null);setLastOk(Date.now());}
      }catch(e){if(alive)setErr(e.message);}
    };
    setData(null);load();
    const t=setInterval(load,DASH_REFRESH_MS);
    const clock=setInterval(()=>setTick(x=>x+1),1000);
    return()=>{alive=false;clearInterval(t);clearInterval(clock);};
  },[store]);
  const ago=lastOk?Math.round((Date.now()-lastOk)/1000):null;
  const k=data?.kpis;
  const syncedAt=data?.synced?.length?data.synced.map(s=>s.synced_at).sort()[0]:null;
  return(
    <div className="chat-page">
      <div className="left">
        <button className="back-btn" onClick={onBack}>&#8592; Back to Home</button>
        <div className="lb-card" style={{background:'#10231a'}}>
          <div className="lb-top">
            <div className="lb-title"><div className="lb-dot" style={{background:err?STATUS.critical:STATUS.good,animation:'pulse 2s infinite'}}/>{err?'OFFLINE':'LIVE'}</div>
            <span className="lb-status" style={{color:'#86efac'}}>Lakebase</span>
          </div>
          <div className="lb-row"><div className="lb-label">Refreshes</div><div className="lb-value">every {DASH_REFRESH_MS/1000}s</div></div>
          <div className="lb-row"><div className="lb-label">Updated</div><div className="lb-value">{ago==null?'—':ago+'s ago'}</div></div>
          <div className="lb-row"><div className="lb-label">Query time</div><div className="lb-value">{data?data.query_ms+' ms':'—'}</div></div>
          <div className="lb-row"><div className="lb-label">Synced from gold</div><div className="lb-value" style={{fontSize:'0.72rem'}}>{syncedAt?new Date(syncedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</div></div>
        </div>
        <div className="section-lbl">Store</div>
        <select className="store-sel" value={store} onChange={e=>setStore(e.target.value)}>
          {stores.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <div className="section-lbl">Live activity</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>

            <div style={{color:'#3C1810',fontWeight:600}}>{a.kind==='receipt'?'📦':'✅'} {a.detail}</div>
            <div style={{color:'#8B7355'}}>{new Date(a.created_at).toLocaleTimeString('en-GB')}</div></div>)}
        </div>
        <button className="back-btn" style={{marginTop:12}} onClick={onInvoice}>&#128230; Go to Delivery &amp; Invoice</button>
      </div>
      <div className="center" style={{display:'flex',flexDirection:'column',overflow:'auto',background:'#FAF7F2'}}>
        <div className="ch-header">
          <div className="ch-header-left">
            <span className="ch-title">&#128202; Store Live Dashboard</span>
            <span className="ch-sub">{data?`${store} (${data.store_id})`:store} · served from Lakebase · approvals update it instantly</span>
          </div>
        </div>
        <div style={{padding:'18px 22px',display:'flex',flexDirection:'column',gap:14}}>

                    <div><div style={{color:INK.primary,fontWeight:600}}>{a.action}</div><div style={{color:'#8B7355'}}>{a.why}</div></div>
                  </div>)}
                </div>}
              </DashCard>
              <DashCard title="Today's demand forecast" sub={data.forecast_today?.length?`UC model demand_forecaster v${data.forecast_today[0].model_version} vs the usual for this weekday`:'Scored daily by the ops job'}>
                <DashTable empty="No forecast for today yet." rows={data.forecast_today||[]}
                  cols={[{k:'product_name',h:'Drink'},{k:'forecast_units',h:'Forecast',num:true,f:r=>Number(r.forecast_units).toFixed(1)},
                    {k:'baseline_same_weekday',h:'Usual',num:true,f:r=>r.baseline_same_weekday==null?'—':Number(r.baseline_same_weekday).toFixed(1)},

              </DashCard>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(360px,1fr))',gap:14}}>
              <DashCard title="Stock cover by ingredient" sub="Days of stock left at the average daily usage · hover a row for detail">

              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <DashCard title="Units sold per day" sub={`Last ${data.demand_daily.length} days of sales data (the synthetic order history ends 14 May 2026) · hover a column`}>

            </div>

              </DashCard>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

function archPath(e){
  const p=e.p;
  if(e.k==='v'){const[a,b]=p;const m=(b[1]-a[1])/2;return `M${a[0]},${a[1]} C${a[0]},${a[1]+m} ${b[0]},${b[1]-m} ${b[0]},${b[1]}`;}
  if(e.k==='h'){const[a,b]=p;const m=(b[0]-a[0])/2;return `M${a[0]},${a[1]} C${a[0]+m},${a[1]} ${b[0]-m},${b[1]} ${b[0]},${b[1]}`;}
  const r=10;let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const[x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];
    const d1=Math.hypot(x1-x0,y1-y0),d2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,d1/2,d2/2);
    const ax=x1-(x1-x0)/d1*rr,ay=y1-(y1-y0)/d1*rr,bx=x1+(x2-x1)/d2*rr,by=y1+(y2-y1)/d2*rr;
    d+=` L${ax},${ay} Q${x1},${y1} ${bx},${by}`;
  }
  const l=p[p.length-1];return d+` L${l[0]},${l[1]}`;
}

function useFitScale(ref,w){
  const[s,set]=useState(1);
  useEffect(()=>{
    if(!ref.current)return;
    const ro=new ResizeObserver(([e])=>set(Math.min(1.15,e.contentRect.width/w)));
    ro.observe(ref.current);return()=>ro.disconnect();
  },[]);
  return s;
}

  const parseSseLine=(line,onData)=>{
    const trimmed=(line||'').trim();
    if(!trimmed.startsWith('data: '))return;
    try{onData(JSON.parse(trimmed.slice(6)));}catch(e){}
  };

  },[]);

  const typeOut=(text,cb)=>{
    const words=text.split(/(\s+)/);
    let shown='',wi=0,batch=4;
    const t=setInterval(()=>{
      const end=Math.min(wi+batch,words.length);
      for(let w=wi;w<end;w++)shown+=words[w];
      wi=end; setStxt(shown);
      if(wi>=words.length){clearInterval(t);setStxt('');cb();}
    },25);
  };

  const sendCached=async(idx)=>{
    if(streaming)return;
    const prompt=examples[idx]; if(!prompt)return;
    setView('chat');

    setStreaming(true); setStxt('');
    try{
      const c=await fetch(`/api/cached/${idx}`).then(r=>r.json());
      if(c.cached){setTimeout(()=>{typeOut(c.answer,()=>{setMsgs(prev=>[...prev,{role:'assistant',content:c.answer}]);setStreaming(false);refreshStats();});},2500);return;}
    }catch(e){}
    sendLive(prompt,true);
  };

  const sendLive=async(text,alreadyAdded)=>{
    const userMsg=(text||query).trim();
    if(!userMsg||streaming)return;
    if(!text)setQuery('');
    setView('chat');
    if(!alreadyAdded)setMsgs(prev=>[...prev,{role:'user',content:userMsg}]);
    setStreaming(true); setStxt('');
    const history=msgs.map(m=>({role:m.role,content:m.content}));
    try{
      const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:userMsg,conversation_id:convId,store_location:store,history})});
      const newId=resp.headers.get('X-Conversation-Id');
      if(newId)setConvId(newId);
      const reader=resp.body.getReader();
      const dec=new TextDecoder();
      let acc='',full='';
      const handleEvent=(data)=>{
        if(data.keepalive)return;
        if(data.status){setStxt(data.status);return;}
        if(data.done){
          full=data.full_text;
          const showAnswer=()=>{
            setStxt('');
            typeOut(full,()=>{setMsgs(prev=>[...prev,{role:'assistant',content:full}]);setStreaming(false);refreshStats();});
          };

          return true;
        }
        if(data.delta){full+=data.delta;setStxt(full);}
        return false;
      };
      while(true){
        const{done,value}=await reader.read();
        if(done)break;
        acc+=dec.decode(value,{stream:true});
        const lines=acc.split('\n'); acc=lines.pop();
        for(const line of lines){
          let completed=false;

        }
      }
      // Flush any final SSE event that arrived without trailing newline.
      let completed=false;
      parseSseLine(acc,data=>{completed=handleEvent(data)===true;});

    }catch(err){
      // Stream could fail even if backend eventually saved assistant message.
      let recovered=false;

            <div className="prod-card"><span className="prod-emoji">&#10052;</span><div className="prod-name">Cold Coffee</div><div className="prod-desc">Chilled decoction blended smooth with ice cream</div><span className="prod-tag">Specialty</span></div>
            <div className="prod-card"><span className="prod-emoji">&#127861;</span><div className="prod-name">Masala Chai</div><div className="prod-desc">Kerala spice blend — cardamom, ginger, cinnamon</div><span className="prod-tag">Traditional</span></div>
            <div className="prod-card"><span className="prod-emoji">&#127822;</span><div className="prod-name">Kaapi Frappe</div><div className="prod-desc">Iced blended coffee with caramel swirl</div><span className="prod-tag">Specialty</span></div>
            <div className="prod-card"><span className="prod-emoji">&#127802;</span><div className="prod-name">Rose Milk</div><div className="prod-desc">Chilled rose-scented milk, a South Indian classic</div><span className="prod-tag">Traditional</span></div>
            <div className="prod-card"><span className="prod-emoji">&#129381;</span><div className="prod-name">Badam Milk</div><div className="prod-desc">Rich almond paste milk with saffron and cardamom</div><span className="prod-tag">Traditional</span></div>
            <div className="prod-card"><span className="prod-emoji">&#129472;</span><div className="prod-name">Mango Lassi</div><div className="prod-desc">Seasonal Alphonso mango blended with fresh yogurt</div><span className="prod-tag">Seasonal</span></div>
            <div className="prod-card"><span className="prod-emoji">&#127849;</span><div className="prod-name">Jaggery Cold Brew</div><div className="prod-desc">18-hour cold brew sweetened with organic jaggery</div><span className="prod-tag">Seasonal</span></div>
          </div>
        </section>

        <div className="landing-footer" id="about">
          Kaapi Bricks Pvt. Ltd. &bull; Flagship: Koramangala, Bangalore &bull; Powered by <a href="#">Databricks AI</a>
        </div>
      </div>
    );
  }

  // ===== INVOICE PAGE =====
  const uploadInvoice=async()=>{
    if(!invFile||invParsing)return;
    setInvParsing(true);setInvResult(null);setInvApproved(false);
    const formData=new FormData();
    formData.append('file',invFile);
    formData.append('store',store);
    try{
      const resp=await fetch('/api/parse-invoice',{method:'POST',body:formData});
      const data=await resp.json();
      setInvResult(data);
    }catch(e){setInvResult({error:e.message});}
    setInvParsing(false);
  };

  const fetchInventory=async()=>{
    setInvLoadingInv(true);
    try{
      const resp=await fetch('/api/lakebase/inventory/STR-001');
      const data=await resp.json();
      setInvInventory(data.inventory||[]);
    }catch(e){console.error(e);}
    setInvLoadingInv(false);
  };

  const approveInvoice=async()=>{
    if(!invResult||invApproved)return;
    const items=(invResult.matched_items||[]).filter(i=>i.ingredient_id&&i.invoice_qty);
    try{
      const resp=await fetch('/api/approve-invoice',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items,store_id:'STR-001',po_id:invResult.po_match?.po_id})});
      const d=await resp.json();
      setInvLakebase(d.lakebase||null);
      setInvApproved(true);
      // Auto-refresh inventory after approval
      setTimeout(fetchInventory,2000);
    }catch(e){alert('Error: '+e.message);}
  };

  if(view==='invoice'){
    const r=invResult;
    const ext=r?.extracted;
    const statusColor={'match':'#16A34A','warning':'#D97706','error':'#DC2626','extra':'#DC2626','missing':'#9333EA'};
    const statusLabel={'match':'Match','warning':'Warning','error':'Discrepancy','extra':'Extra Item','missing':'Missing'};
    return(
      <div className="chat-page">
        <div className="left">
          <button className="back-btn" onClick={()=>setView('landing')}>&#8592; Back to Home</button>
          <div className="lb-card" style={{background:'#1a1a2e'}}>
            <div className="lb-top">
              <div className="lb-title"><div className="lb-dot" style={{background:'#F59E0B'}}/>INVOICE PARSER</div>
              <span className="lb-status" style={{color:'#F59E0B'}}>Unity AI Gateway</span>
            </div>
            <div className="lb-row"><div className="lb-label">Powered by</div><div className="lb-value" style={{fontSize:'0.75rem'}}>kaapi_llm model service</div></div>
          </div>
          <div className="section-lbl">Store</div>
          <select className="store-sel" value={store} onChange={e=>setStore(e.target.value)}>
            {stores.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <div className="center" style={{display:'flex',flexDirection:'column',overflow:'auto'}}>
          <div className="ch-header">
            <div className="ch-header-left">
              <span className="ch-title">&#128230; Delivery &amp; Invoice</span>
              <span className="ch-sub">Upload supplier invoice — auto-parse, match PO, update inventory</span>
            </div>
          </div>
          <div style={{padding:'20px 24px'}}>
            {/* Upload Area */}
            <div style={{border:'2px dashed #D4C4B0',borderRadius:'14px',padding:'32px',textAlign:'center',marginBottom:'20px',background:invFile?'#F0FDF4':'white'}}>
              {invFile?(
                <div>
                  <div style={{fontSize:'1.2rem',marginBottom:'8px'}}>&#128196; {invFile.name}</div>
                  <div style={{fontSize:'0.82rem',color:'#6B4C3B'}}>{(invFile.size/1024).toFixed(1)} KB</div>
                  <div style={{marginTop:'12px',display:'flex',gap:'8px',justifyContent:'center'}}>
                    <button style={{padding:'8px 20px',background:'#3C1810',color:'white',border:'none',borderRadius:'10px',fontSize:'0.85rem',fontWeight:600,cursor:'pointer'}} onClick={uploadInvoice} disabled={invParsing}>{invParsing?'Parsing...':'Parse Invoice'}</button>
                    <button style={{padding:'8px 20px',background:'white',color:'#6B4C3B',border:'1px solid #D4C4B0',borderRadius:'10px',fontSize:'0.85rem',cursor:'pointer'}} onClick={()=>{setInvFile(null);setInvResult(null);setInvApproved(false);}}>Clear</button>
                  </div>
                </div>
              ):(
                <label style={{cursor:'pointer'}}>
                  <div style={{fontSize:'2rem',marginBottom:'8px'}}>&#128228;</div>
                  <div style={{fontSize:'0.95rem',fontWeight:600,color:'#3C1810'}}>Drop invoice PDF or click to upload</div>
                  <div style={{fontSize:'0.78rem',color:'#8B7355',marginTop:'4px'}}>Supports PDF, PNG, JPG</div>
                  <input type="file" accept=".pdf,.png,.jpg,.jpeg" style={{display:'none'}} onChange={e=>setInvFile(e.target.files[0])}/>
                </label>
              )}
            </div>

            {invParsing&&<div style={{textAlign:'center',padding:'20px',color:'#8B5E3C'}}>&#9749; Parsing invoice through Unity AI Gateway...</div>}

            {r&&!r.error&&(
              <div>
                {/* Extracted Invoice */}
                <div style={{background:'white',border:'1.5px solid #E8DDD0',borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
                  <h3 style={{fontFamily:'Playfair Display,serif',fontSize:'1rem',color:'#3C1810',marginBottom:'12px'}}>Extracted Invoice</h3>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',fontSize:'0.82rem',marginBottom:'12px'}}>
                    <div><strong>Supplier:</strong> {ext?.supplier_name}</div>
                    <div><strong>Invoice #:</strong> {ext?.invoice_number}</div>
                    <div><strong>Date:</strong> {ext?.invoice_date}</div>
                    <div><strong>PO Ref:</strong> {ext?.po_reference||'—'}</div>
                    <div><strong>To:</strong> {ext?.delivery_to}</div>
                    <div><strong>Total:</strong> &#8377;{ext?.total_amount?.toLocaleString()}</div>
                  </div>
                </div>

                {/* PO Match */}
                {r.po_match&&(
                  <div style={{background:'#F0FDF4',border:'1.5px solid #86EFAC',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
                    <h3 style={{fontSize:'0.9rem',color:'#16A34A',marginBottom:'8px'}}>&#10003; PO Match Found: {r.po_match.po_id}</h3>
                    <div style={{fontSize:'0.82rem',marginBottom:'10px'}}>Supplier: {r.supplier_match?.name} | PO Amount: &#8377;{parseFloat(r.po_match.total_amount).toLocaleString()} | Status: {r.po_match.status}</div>
                    {r.po_lines&&r.po_lines.length>0&&(
                      <div>
                        <div style={{fontSize:'0.78rem',fontWeight:600,color:'#166534',marginBottom:'6px'}}>Purchase Order Line Items:</div>
                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}>
                          <thead><tr style={{background:'#DCFCE7'}}>
                            <th style={{padding:'6px 8px',textAlign:'left'}}>Ingredient</th>
                            <th style={{padding:'6px 8px',textAlign:'right'}}>Qty</th>
                            <th style={{padding:'6px 8px',textAlign:'left'}}>Unit</th>
                            <th style={{padding:'6px 8px',textAlign:'right'}}>Rate</th>
                            <th style={{padding:'6px 8px',textAlign:'right'}}>Total</th>
                          </tr></thead>
                          <tbody>{r.po_lines.map((pl,i)=>(
                            <tr key={i} style={{borderBottom:'1px solid #BBF7D0'}}>
                              <td style={{padding:'5px 8px'}}>{pl.ingredient_name}</td>
                              <td style={{padding:'5px 8px',textAlign:'right'}}>{pl.quantity}</td>
                              <td style={{padding:'5px 8px'}}>{pl.unit}</td>
                              <td style={{padding:'5px 8px',textAlign:'right'}}>&#8377;{parseFloat(pl.unit_price).toLocaleString()}</td>
                              <td style={{padding:'5px 8px',textAlign:'right'}}>&#8377;{parseFloat(pl.line_total).toLocaleString()}</td>
                            </tr>
                          ))}</tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}
                {!r.po_match&&(
                  <div style={{background:'#FEF2F2',border:'1.5px solid #FCA5A5',borderRadius:'14px',padding:'16px',marginBottom:'16px'}}>
                    <h3 style={{fontSize:'0.9rem',color:'#DC2626'}}>&#10007; No matching PO found</h3>
                  </div>
                )}

                {/* Line Item Comparison */}
                <div style={{background:'white',border:'1.5px solid #E8DDD0',borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
                  <h3 style={{fontFamily:'Playfair Display,serif',fontSize:'1rem',color:'#3C1810',marginBottom:'12px'}}>Item Comparison</h3>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                    <thead><tr style={{background:'#F5EDE0'}}>
                      <th style={{padding:'8px',textAlign:'left'}}>Item</th>
                      <th style={{padding:'8px',textAlign:'right'}}>Invoice Qty</th>
                      <th style={{padding:'8px',textAlign:'right'}}>PO Qty</th>
                      <th style={{padding:'8px',textAlign:'right'}}>Invoice Rate</th>
                      <th style={{padding:'8px',textAlign:'right'}}>PO Rate</th>
                      <th style={{padding:'8px',textAlign:'center'}}>Status</th>
                    </tr></thead>
                    <tbody>
                      {(r.matched_items||[]).map((item,i)=>(
                        <tr key={i} style={{borderBottom:'1px solid #E8DDD0'}}>
                          <td style={{padding:'8px'}}>{item.invoice_name||item.po_name}</td>
                          <td style={{padding:'8px',textAlign:'right'}}>{item.invoice_qty||'—'} {item.invoice_unit||''}</td>
                          <td style={{padding:'8px',textAlign:'right'}}>{item.po_qty||'—'}</td>
                          <td style={{padding:'8px',textAlign:'right'}}>{item.invoice_rate?'₹'+item.invoice_rate:'—'}</td>
                          <td style={{padding:'8px',textAlign:'right'}}>{item.po_rate?'₹'+item.po_rate:'—'}</td>
                          <td style={{padding:'8px',textAlign:'center'}}>
                            <span style={{background:statusColor[item.status]||'#888',color:'white',padding:'2px 10px',borderRadius:'10px',fontSize:'0.72rem',fontWeight:600}}>{statusLabel[item.status]||item.status}</span>
                            {item.issues?.map((iss,j)=><div key={j} style={{fontSize:'0.72rem',color:'#6B4C3B',marginTop:'2px'}}>{iss}</div>)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* Approve Button + View Inventory */}
                <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
                  <button style={{padding:'10px 24px',background:invApproved?'#16A34A':'#3C1810',color:'white',border:'none',borderRadius:'10px',fontSize:'0.88rem',fontWeight:600,cursor:invApproved?'default':'pointer'}} onClick={approveInvoice} disabled={invApproved}>
                    {invApproved?'✓ Approved & Inventory Updated':'Approve & Update Inventory'}
                  </button>
                  <button style={{padding:'10px 24px',background:'white',color:'#3C1810',border:'1.5px solid #D4C4B0',borderRadius:'10px',fontSize:'0.88rem',fontWeight:600,cursor:'pointer'}} onClick={fetchInventory} disabled={invLoadingInv}>
                    {invLoadingInv?'Loading...':'View Current Inventory'}
                  </button>
                  {invApproved&&<span style={{color:'#16A34A',fontSize:'0.85rem',fontWeight:600}}>
                    Receipts recorded in Delta.{invLakebase&&!invLakebase.error?` Lakebase updated live: ${invLakebase.updated_items} stock item(s)${invLakebase.po_closed?', PO closed':''}.`:''}
                    {invLakebase&&invLakebase.error?' (Lakebase update failed; it will catch up on the next sync.)':''}
                    {' '}<a href="#" onClick={e=>{e.preventDefault();setView('dashboard')}} style={{color:'#10231a'}}>Open live dashboard →</a></span>}
                  {r.latency_ms&&<span style={{color:'#8B7355',fontSize:'0.78rem',marginLeft:'auto'}}>Parsed in {(r.latency_ms/1000).toFixed(1)}s</span>}
                </div>

                {/* Current Inventory Table */}
                {invInventory&&(
                  <div style={{background:'white',border:'1.5px solid #E8DDD0',borderRadius:'14px',padding:'20px',marginTop:'16px'}}>
                    <h3 style={{fontFamily:'Playfair Display,serif',fontSize:'1rem',color:'#3C1810',marginBottom:'12px'}}>
                      Current Inventory — Koramangala (STR-001)
                      {invApproved&&<span style={{fontSize:'0.75rem',color:'#16A34A',marginLeft:'8px',fontWeight:400}}>Updated with new delivery</span>}
                    </h3>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.82rem'}}>
                      <thead><tr style={{background:'#F5EDE0'}}>
                        <th style={{padding:'8px',textAlign:'left'}}>Ingredient</th>
                        <th style={{padding:'8px',textAlign:'right'}}>Current Stock</th>
                        <th style={{padding:'8px',textAlign:'left'}}>Unit</th>
                        <th style={{padding:'8px',textAlign:'right'}}>Reorder At</th>
                        <th style={{padding:'8px',textAlign:'center'}}>Status</th>
                      </tr></thead>
                      <tbody>
                        {invInventory.map((inv,i)=>{
                          const stock=parseFloat(inv.current_stock||0);
                          const threshold=parseFloat(inv.reorder_threshold||0);
                          const isLow=stock<=threshold;
                          const isCritical=stock<=threshold*0.5;
                          return(
                            <tr key={i} style={{borderBottom:'1px solid #E8DDD0',background:isCritical?'#FEF2F2':isLow?'#FFFBEB':'white'}}>
                              <td style={{padding:'6px 8px'}}>{inv.name}</td>
                              <td style={{padding:'6px 8px',textAlign:'right',fontWeight:600}}>{stock}</td>
                              <td style={{padding:'6px 8px'}}>{inv.unit}</td>
                              <td style={{padding:'6px 8px',textAlign:'right'}}>{threshold}</td>
                              <td style={{padding:'6px 8px',textAlign:'center'}}>
                                <span style={{padding:'2px 10px',borderRadius:'10px',fontSize:'0.72rem',fontWeight:600,
                                  background:isCritical?'#DC2626':isLow?'#D97706':'#16A34A',color:'white'}}>
                                  {isCritical?'Critical':isLow?'Low':'OK'}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
            {r?.error&&<div style={{color:'#DC2626',padding:'20px'}}>Error: {r.error}</div>}
          </div>
        </div>
      </div>
    );
  }

  // ===== CHAT PAGE =====
  return(
    <div className="chat-page">
      {/* LEFT: Lakebase + Store + Cached Questions */}
      <div className="left">
        <button className="back-btn" onClick={()=>setView('landing')}>&#8592; Back to Home</button>


        {/* Lakebase card */}
        <div className="lb-card">
          <div className="lb-top">
            <div className="lb-title"><div className={`lb-dot ${stats?.connected?'':'off'}`}/>LAKEBASE</div>
            <span className={`lb-status ${stats?.connected?'':'off'}`}>{stats?.connected?'Connected':'Disconnected'}</span>
          </div>
          <div className="lb-row"><div className="lb-label">Instance</div><div className="lb-value">{stats?.instance||'...'}</div></div>
          <div className="lb-row"><div className="lb-label">Database</div><div className="lb-value">{stats?.database||'...'}</div></div>
        </div>

        {/* Stats */}
        <div className="stats-row">
          <div className="stat"><div className="stat-num">{stats?.chats||0}</div><div className="stat-lbl">Chats</div></div>
          <div className="stat"><div className="stat-num">{stats?.messages||0}</div><div className="stat-lbl">Messages</div></div>
          <div className="stat"><div className="stat-num">{stats?.cache_entries||0}</div><div className="stat-lbl">Cached</div></div>
        </div>

        {/* Memory */}
        <div className="mem-card">
          <div className="mem-toggle" onClick={()=>setMemOpen(!memOpen)}>
            <span>View Memory Summary</span>
            <button>{memOpen?'\u25B2':'\u25BC'}</button>
          </div>
          {memOpen&&stats&&<div style={{animation:'fadeIn 0.2s',marginTop:'8px'}}>
            <div className="mem-row"><span className="mem-key">Engine: </span><span className="mem-val">{stats.engine}</span></div>
            <div className="mem-row"><span className="mem-key">Instance: </span><span className="mem-val">{stats.instance}</span></div>
            <div className="mem-row"><span className="mem-key">Database: </span><span className="mem-val">{stats.database}</span></div>
            <div className="mem-row"><span className="mem-key">Auth: </span><span className="mem-val">{stats.auth}</span></div>
            <div className="mem-row"><span className="mem-key">Tables: </span><span className="mem-val">{stats.tables}</span></div>
            <div className="mem-row"><span className="mem-key">Total stored: </span><span className="mem-val">{stats.chats} conversations, {stats.messages} messages</span></div>
          </div>}
        </div>

        {/* Store selector */}
        <div className="section-lbl">Store</div>
        <select className="store-sel" value={store} onChange={e=>setStore(e.target.value)}>
          {stores.map(s=><option key={s} value={s}>{s}</option>)}
        </select>

        <button className="new-btn" onClick={newChat}>+ New Chat</button>

        {/* Cached questions — pushed to very bottom */}
        <div className="cq-section">
          <div className="section-lbl" style={{margin:'8px 0 4px',opacity:0.5}}>Try asking...</div>
          {examples.map((ex,i)=><div key={i} className="cq" onClick={()=>sendCached(i)}>{ex}</div>)}
        </div>
      </div>

      {/* CENTER: Chat */}
      <div className="center">
        <div className="ch-header">
          <div className="ch-header-left">
            <span className="ch-title">&#9749; Kaapi Bricks HQ</span>
            <span className="ch-sub">Multi-Agent Supervisor</span>
          </div>
          <div className="ch-powered"><span className="ch-powered-dot"/>Powered by Databricks Agents</div>
        </div>
        <div className="ch-msgs">
          {msgs.length===0&&!streaming&&<div className="ch-empty">
            <h2>Namaskara!</h2>
            <p>Ask anything about Kaapi Bricks — recipes, sales, inventory, suppliers, or operations. Click a quick question on the left, or type below.</p>
          </div>}
          {msgs.map((m,i)=>m.role==='user'?
            <div key={i} className="mu"><div className="mu-b">{m.content}</div></div>
            :<div key={i} className="ma" style={{animation:'slideUp 0.3s'}}>
              <div className="ma-c">
                <div className="ma-h">
                  <div className="ma-av">&#9749;</div>
                  <span className="ma-n">Kaapi Bricks HQ</span>
                </div>
                <div className="ma-body" dangerouslySetInnerHTML={md(m.content)}/>
                <div className="fb-r">
                  <button className={`fb ${fb[i]==='positive'?'p':''}`} onClick={()=>doFb(i,'positive')}>&#128077;</button>
                  <button className={`fb ${fb[i]==='negative'?'n':''}`} onClick={()=>doFb(i,'negative')}>&#128078;</button>
                </div>
              </div>
            </div>
          )}
          {streaming&&stxt&&<div className="ma" style={{animation:'fadeIn 0.3s'}}><div className="ma-c">
            <div className="ma-h"><div className="ma-av">&#9749;</div><span className="ma-n">Kaapi Bricks HQ</span></div>
            <div className="ma-body streaming" dangerouslySetInnerHTML={md(stxt)}/>
          </div></div>}
          {streaming&&!stxt&&<BrewingWait/>}
          <div ref={endRef}/>
        </div>
        <div className="ch-bar">
          <div className="ch-wrap">
            <input className="ch-in" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={handleKey}
              placeholder="Ask about coffee, recipes, sales, inventory, or operations..." disabled={streaming}/>
            <button className="ch-send" onClick={()=>sendLive()} disabled={streaming||!query.trim()}>{streaming?'...':'Send'}</button>
          </div>
          {!streaming&&<div className="qp-row" style={{paddingLeft:0,paddingRight:0,paddingTop:'8px'}}>
            {examples.map((ex,i)=><button key={i} className="qp" onClick={()=>sendLive(ex)}>{ex}</button>)}
          </div>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
